<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Open email</title>
<style>
:root{--bg:#fff;--ink:#14171a;--mut:#5b636b;--line:#dfe3e6;--brand:#0a7a3e}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--ink:#eef1f3;--mut:#9aa3ab;--line:#2a2f34;--brand:#3fbf7a}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,Segoe UI,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px;display:grid;gap:14px}
h1{font-size:20px;margin:0}p{margin:0;color:var(--mut)}
a,button{display:block;text-align:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px/1.2 inherit;text-decoration:none;cursor:pointer}
.pri{background:var(--brand);border-color:var(--brand);color:#fff}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--mut);border-top:1px solid var(--line);padding-top:12px;margin:0}
</style></head><body><main>
<h1 id="h">Opening Outlook…</h1>
<p id="sub">If nothing happens, tap the button.</p>
<a id="ol" class="pri" href="#">Open in Outlook</a>
<a id="mt" href="#">Open in default mail app</a>
<button id="cp" type="button">Copy email text</button>
<pre id="pv"></pre>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.hash.slice(1)),to=q.get('to')||'',s=q.get('s')||'',b=q.get('b')||'';
  if(!to&&!s&&!b){document.getElementById('h').textContent='Nothing to send';document.getElementById('sub').textContent='Open this from the Chase button in the Command Centre.';return}
  var e=encodeURIComponent,
      ol='ms-outlook://compose?to='+e(to)+'&subject='+e(s)+'&body='+e(b),
      mt='mailto:'+to+'?subject='+e(s)+'&body='+e(b.replace(/\r?\n/g,'\r\n'));
  document.getElementById('ol').href=ol;document.getElementById('mt').href=mt;
  document.getElementById('pv').textContent='To: '+to+'\nSubject: '+s+'\n\n'+b;
  document.getElementById('cp').onclick=function(){var t='To: '+to+'\nSubject: '+s+'\n\n'+b;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){document.getElementById('cp').textContent='Copied'},function(){document.getElementById('cp').textContent='Copy failed — select the text below'})};
  try{history.replaceState(null,'',location.pathname)}catch(x){}
  setTimeout(function(){location.href=ol},150);
})();
</script></body></html>
